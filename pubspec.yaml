name: kutoot_mobile
description: Kutoot loyalty app - Flutter (Android & iOS)
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # HTTP & API
  dio: ^5.4.0
  flutter_secure_storage: ^9.0.0

  # State management
  provider: ^6.1.1

  # Navigation
  go_router: ^13.0.0

  # UI
  cached_network_image: ^3.3.1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.2.2

  # QR Scanner
  mobile_scanner: ^6.0.2
  razorpay_flutter: ^1.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.1

flutter:
  uses-material-design: true

  assets:
    - assets/images/
